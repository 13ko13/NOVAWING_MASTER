<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="770" viewBox="0 100 1540 770">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505b"/>
      <stop offset="1" stop-color="#23262c"/>
    </linearGradient>
    <style>
      text { font-family: "Noto Sans JP Medium", "Noto Sans JP", "Yu Gothic UI", sans-serif; fill: #111; }
      .head { font-family: "Noto Sans JP Black", "Noto Sans JP", sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 0.5px; }
      .sub  { font-family: "Noto Sans JP Medium", "Noto Sans JP", sans-serif; font-size: 20px; font-weight: 500; }
      .box  { fill: #fff; stroke: #111; stroke-width: 4; }
      .lead { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
      .dot  { fill: #2CE0B0; stroke: #111; stroke-width: 2.5; }
      .key  { font-family: "Noto Sans JP Black", "Noto Sans JP", sans-serif; font-size: 20px; font-weight: 900; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <g transform="translate(80 0)">
  <!-- ===== コントローラー本体 ===== -->
  <!-- トリガー（未使用） -->
  <path d="M 480 330 Q 500 268 590 258" stroke="#5a5e66" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M 920 330 Q 900 268 810 258" stroke="#5a5e66" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- LB（使用：ティール縁取り） / RB（未使用） -->
  <path d="M 445 352 Q 480 302 600 296" stroke="#2CE0B0" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M 445 352 Q 480 302 600 296" stroke="#3a3f48" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M 955 352 Q 920 302 800 296" stroke="#4a4e55" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- ボディ -->
  <path d="M 520 320 C 600 300, 800 300, 880 320 C 950 335, 990 380, 1010 460 C 1040 580, 1060 690, 1000 720 C 950 745, 910 700, 880 650 C 850 600, 820 590, 700 590 C 580 590, 550 600, 520 650 C 490 700, 450 745, 400 720 C 340 690, 360 580, 390 460 C 410 380, 450 335, 520 320 Z"
        fill="url(#body)" stroke="#111" stroke-width="5"/>

  <!-- ホームボタン（未使用） -->
  <circle cx="700" cy="362" r="20" fill="#5a5e66" stroke="#2a2d33" stroke-width="3"/>

  <!-- ビューボタン（未使用） -->
  <circle cx="660" cy="420" r="13" fill="#5a5e66" stroke="#2a2d33" stroke-width="2"/>
  <!-- メニュー(START)ボタン（使用） -->
  <circle cx="740" cy="420" r="15" fill="#3a3f48" stroke="#2CE0B0" stroke-width="4"/>
  <path d="M 733 414 h 14 M 733 420 h 14 M 733 426 h 14" stroke="#fff" stroke-width="2.5"/>

  <!-- 左スティック（使用） -->
  <circle cx="540" cy="420" r="44" fill="#16181c"/>
  <circle cx="540" cy="420" r="33" fill="#3a3f48" stroke="#2CE0B0" stroke-width="5"/>
  <circle cx="540" cy="420" r="20" fill="none" stroke="#565c66" stroke-width="2"/>

  <!-- 右スティック（未使用） -->
  <circle cx="790" cy="530" r="44" fill="#16181c"/>
  <circle cx="790" cy="530" r="33" fill="#4a4e55"/>
  <circle cx="790" cy="530" r="20" fill="none" stroke="#5e636c" stroke-width="2"/>

  <!-- 十字キー（上のみ使用） -->
  <circle cx="610" cy="530" r="44" fill="#16181c"/>
  <rect x="592" y="494" width="36" height="72" rx="6" fill="#4a4e55"/>
  <rect x="574" y="512" width="72" height="36" rx="6" fill="#4a4e55"/>
  <rect x="592" y="494" width="36" height="30" rx="6" fill="#2CE0B0" stroke="#111" stroke-width="2"/>
  <path d="M 610 500 l 9 13 h -18 z" fill="#111"/>

  <!-- フェイスボタン -->
  <circle cx="860" cy="377" r="20" fill="#6b6650"/>                        <!-- Y（未使用） -->
  <text class="key" x="860" y="378" style="fill:#c9c3a3">Y</text>
  <circle cx="817" cy="420" r="20" fill="#2F7BD8" stroke="#111" stroke-width="3"/>  <!-- X -->
  <text class="key" x="817" y="421">X</text>
  <circle cx="903" cy="420" r="20" fill="#E0383E" stroke="#111" stroke-width="3"/>  <!-- B -->
  <text class="key" x="903" y="421">B</text>
  <circle cx="860" cy="463" r="20" fill="#4FB43A" stroke="#111" stroke-width="3"/>  <!-- A -->
  <text class="key" x="860" y="464">A</text>

  <!-- ===== 引き出し線 ===== -->
  <polyline class="lead" points="280,162 470,322"/>
  <polyline class="lead" points="280,372 512,402"/>
  <polyline class="lead" points="280,602 590,512"/>
  <polyline class="lead" points="1100,292 817,292 817,398"/>
  <polyline class="lead" points="1100,426 925,421"/>
  <polyline class="lead" points="1100,576 860,576 860,485"/>
  <polyline class="lead" points="740,790 740,437"/>
  <circle class="dot" cx="470" cy="322" r="7"/>
  <circle class="dot" cx="512" cy="402" r="7"/>
  <circle class="dot" cx="590" cy="512" r="7"/>
  <circle class="dot" cx="817" cy="398" r="7"/>
  <circle class="dot" cx="925" cy="421" r="7"/>
  <circle class="dot" cx="860" cy="485" r="7"/>
  <circle class="dot" cx="740" cy="437" r="7"/>

  <rect class="box" x="560" y="790" width="360" height="72" rx="12"/>
  <text class="head" x="580" y="836">START <tspan class="sub">（≡ボタン）ポーズ</tspan></text>
  </g>

  <!-- ===== ラベル（左） ===== -->
  <rect class="box" x="20" y="120" width="340" height="84" rx="12"/>
  <text class="head" x="40" y="155">LB <tspan class="sub">（長押し）</tspan></text>
  <text class="sub"  x="40" y="187">操作説明を画面に表示</text>

  <rect class="box" x="20" y="330" width="340" height="84" rx="12"/>
  <text class="head" x="40" y="365">左スティック</text>
  <text class="sub"  x="40" y="397">機体の移動／メニュー選択</text>

  <rect class="box" x="20" y="560" width="340" height="84" rx="12"/>
  <text class="head" x="40" y="595">十字キー ↑</text>
  <text class="sub"  x="40" y="627">宙返り（ゲージ消費）</text>

  <!-- ===== ラベル（右） ===== -->
  <rect class="box" x="1180" y="250" width="340" height="84" rx="12"/>
  <circle cx="1217" cy="282" r="17" fill="#2F7BD8" stroke="#111" stroke-width="2.5"/>
  <text class="key" x="1217" y="283" style="font-size:18px">X</text>
  <text class="head" x="1244" y="292">ボタン</text>
  <text class="sub"  x="1200" y="320">ブースト（ゲージMAX時）</text>

  <rect class="box" x="1180" y="370" width="340" height="112" rx="12"/>
  <circle cx="1217" cy="402" r="17" fill="#E0383E" stroke="#111" stroke-width="2.5"/>
  <text class="key" x="1217" y="403" style="font-size:18px">B</text>
  <text class="head" x="1244" y="412">ショット</text>
  <text class="sub"  x="1200" y="442">長押し→離すとロックオン</text>
  <text class="sub"  x="1200" y="469">再度押してチャージショット</text>

  <rect class="box" x="1180" y="520" width="340" height="112" rx="12"/>
  <circle cx="1217" cy="552" r="17" fill="#4FB43A" stroke="#111" stroke-width="2.5"/>
  <text class="key" x="1217" y="553" style="font-size:18px">A</text>
  <text class="head" x="1244" y="562">ボタン</text>
  <text class="sub"  x="1200" y="592">ブレーキ（ゲージMAX時）</text>
  <text class="sub"  x="1200" y="619">メニューの決定</text>

</svg>
